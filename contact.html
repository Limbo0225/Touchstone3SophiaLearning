<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - North Star Bakery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>North Star Bakery</h1>
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html" aria-current="page">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Get in Touch</h2>
        <div id="welcome-message"></div>
        <p>Have a question or custom catering order? Send us a message below!</p>

        <form id="contact-form" novalidate>
            <div class="form-group">
                <label for="full-name">Full Name (Required)</label>
                <input type="text" id="full-name" name="full_name">
                <span class="error-message" id="name-error"></span>
            </div>

            <div class="form-group">
                <label for="email">Email Address (Required)</label>
                <input type="email" id="email" name="email">
                <span class="error-message" id="email-error"></span>
            </div>

            <div class="form-group">
                <label for="inquiry-type">Inquiry Type</label>
                <select id="inquiry-type" name="inquiry_type">
                    <option value="general">General Question</option>
                    <option value="catering">Custom Catering Order</option>
                    <option value="feedback">Feedback</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message (Required, min 10 characters)</label>
                <textarea id="message" name="message" rows="5"></textarea>
                <span class="error-message" id="message-error"></span>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 North Star Bakery. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
