<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - North Star Bakery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="bakery-logo.png" alt="logo">
        <h1>North Star Bakery</h1>
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html" aria-current="page">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Pre-Order Form</h2>
            <!-- Welcome message injected here by JavaScript -->
            <div id="welcome-message"></div>

            <form id="contact-form" novalidate>
                <fieldset>
                    <legend>Your Info</legend>
                    <label for="full-name">Name:</label>
                    <input type="text" id="full-name" name="full_name">
                    <span class="error-message" id="name-error" style="color: red; display: block;"></span><br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                    <span class="error-message" id="email-error" style="color: red; display: block;"></span>
                </fieldset>

                <fieldset>
                    <legend>Order Details</legend>
                    <label for="message">What do you want? (min 10 characters)</label><br>
                    <textarea id="message" name="message" rows="5"></textarea>
                    <span class="error-message" id="message-error" style="color: red; display: block;"></span>
                </fieldset>

                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Copyright 2026</p>
    </footer>

    <!-- SCRIPT TAG CONNECTING SCRIPT.JS -->
    <script src="script.js?v=3"></script>
</body>
</html>
